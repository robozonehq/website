events {
  worker_connections 2048;
}
http {
  server {
    location /admin/ {
      rewrite ^/admin(.*)$ $1 break;
      proxy_pass http://149.28.43.245:8001;
    }

    location / {

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_pass http://149.28.43.245:8008;
    }
  }
}
