services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8008:4321"
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pb
    ports:
      - "8001:8080"
    volumes:
      - data:/pb/pb_data

volumes:
  data:
    external: true
